<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost code academy courses</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1 class="text-success text-center">GHost Academy Courses</h1>

    <table class="table table-success table-stripped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Course Name</th>
          <th>Fees</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data %}
        <tr>
          <td>{{ row[0] }}</td>
          <td>{{ row[1] }}</td>
          <td>{{ row[2] }}</td>
          <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <h2 class="text-success text-center">Add New Course</h2>
    <form action="/create" method="POST">
      <input type="name" name="name" placeholder="Name" />
      <input type="fees" name="fees" placeholder="Fees" />
      <input type="duration" name="duration" placeholder="Duration" />
      <input type="submit" value="Add" />
    </form>

    <h2>Update or delete Courses</h2>
    <table class="table table-success table-stripped">
      <thead style="display: block">
        <tr>
          <th>ID</th>
          <th width="35%">Name</th>
          <th width="35%">Fees</th>
          <th width="15%">Duration</th>
          <th width="15">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data %}
        <tr>
          <td>
            <form action="/update" method="post">
              <label for="">{{ row[0] }}</label>
              <input type="hidden" name="id" value="{{ row[0] }}" />
              <input type="text" name="name" value="{{ row[1] }}" />
              <input type="text" name="fees" value="{{ row[2] }}" />
              <input
                type="text"
                name="duration"
                size="3"
                value="{{ row[3] }}"
              />
              <input type="submit" value="update" />
            </form>
          </td>
          <td>
            <form action="/delete" method="post">
              <input type="hidden" name="id" value="{{ row[0] }}" />
              <input type="submit" value="delete" />
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
